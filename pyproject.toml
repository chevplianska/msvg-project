[project]
name = "msvg"
version = "0.1.0"
dependencies = [
    "numpy>=1.24,<3",
    "numba",
    "scipy",
    "matplotlib",
    "py_lets_be_rational",
    "seaborn",
    "pandas",
    "jupytext>=1.19.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["msvg*"]
